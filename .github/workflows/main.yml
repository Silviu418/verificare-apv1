{"name": "Construieste APK", "on": {"push": null, "workflow_dispatch": null}, "jobs": {"apk": {"runs-on": "ubuntu-24.04", "steps": [{"uses": "actions/checkout@v4"}, {"uses": "actions/setup-java@v4", "with": {"distribution": "temurin", "java-version": "17"}}, {"uses": "gradle/actions/setup-gradle@v4", "with": {"gradle-version": "8.9"}}, {"name": "Construieste APK", "shell": "bash", "run": "set -e\n# proiectul = folderul care conține app/src/main/AndroidManifest.xml\nM=$(find . -path \"*/app/src/main/AndroidManifest.xml\" -not -path \"./.git/*\" | head -1)\nif [ -z \"$M\" ]; then echo \"NU GASESC app/src/main/AndroidManifest.xml in repository\"; find . -maxdepth 4 -not -path \"./.git*\" | sort; exit 1; fi\nD=$(dirname \"$(dirname \"$(dirname \"$(dirname \"$M\")\")\")\")\necho \"Proiectul este in: $D\"; cd \"$D\"\ncat > settings.gradle <<'EOF'\npluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\ndependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }\nrootProject.name = \"VerificareAPV\"\ninclude ':app'\nEOF\ncat > build.gradle <<'EOF'\nplugins { id 'com.android.application' version '8.7.3' apply false }\nEOF\ncat > gradle.properties <<'EOF'\norg.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\nandroid.useAndroidX=true\nandroid.nonTransitiveRClass=true\nEOF\nif [ ! -f app/verificare-apv.jks ]; then keytool -genkeypair -keystore app/verificare-apv.jks -storepass zeletin-apv -keypass zeletin-apv -alias verificareapv -keyalg RSA -keysize 2048 -validity 10000 -dname \"CN=Verificare APV, O=Ocolul Silvic Zeletin, C=RO\"; fi\ncat > app/build.gradle <<'EOF'\nplugins { id 'com.android.application' }\nandroid {\n    namespace 'ro.zeletin.verificareapv'\n    compileSdk 34\n    defaultConfig { applicationId 'ro.zeletin.verificareapv'; minSdk 24; targetSdk 34; versionCode 1; versionName '1.0' }\n    signingConfigs { apv { storeFile file('verificare-apv.jks'); storePassword 'zeletin-apv'; keyAlias 'verificareapv'; keyPassword 'zeletin-apv' } }\n    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.apv }; debug { signingConfig signingConfigs.apv } }\n    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }\n    lint { checkReleaseBuilds false; abortOnError false }\n    androidResources { noCompress 'html' }\n}\ndependencies { implementation 'androidx.webkit:webkit:1.11.0'; implementation 'androidx.core:core:1.13.1' }\nEOF\nfind app -type f | sort\ngradle --no-daemon assembleRelease\ncp app/build/outputs/apk/release/app-release.apk \"$GITHUB_WORKSPACE/VerificareAPV.apk\"\n"}, {"uses": "actions/upload-artifact@v4", "with": {"name": "VerificareAPV-apk", "path": "VerificareAPV.apk"}}]}}}
