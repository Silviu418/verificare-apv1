{"name": "Construieste APK", "on": {"push": null, "workflow_dispatch": null}, "jobs": {"apk": {"runs-on": "ubuntu-24.04", "steps": [{"uses": "actions/checkout@v4"}, {"name": "Fisiere din repository", "run": "ls -la && ls -la app && ls -la app/src/main && ls -la app/src/main/assets"}, {"uses": "actions/setup-java@v4", "with": {"distribution": "temurin", "java-version": "17"}}, {"uses": "android-actions/setup-android@v3"}, {"uses": "gradle/actions/setup-gradle@v4", "with": {"gradle-version": "8.9"}}, {"name": "Construieste APK", "run": "gradle --no-daemon assembleRelease && cp app/build/outputs/apk/release/app-release.apk VerificareAPV.apk"}, {"uses": "actions/upload-artifact@v4", "with": {"name": "VerificareAPV-apk", "path": "VerificareAPV.apk"}}]}}}
